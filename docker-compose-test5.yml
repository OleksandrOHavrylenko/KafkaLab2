services:
  producer-reddits:
    container_name: producer-reddits
    image: producer-reddits
    build:
      context: .
      dockerfile: Dockerfile-producer
    networks:
      - kafka-net
    environment:
      OUTPUT_TOPIC: "subreddits"
      INPUT_FILE: "full"
    depends_on:
      - report-reddits
      - consumer-reddits-1

  consumer-reddits-1:
    container_name: consumer-reddits-1
    image: consumer-reddits
    build:
      context: .
      dockerfile: Dockerfile-consumer
    networks:
      - kafka-net
    environment:
      GROUP_ID: "subreddits-group-1"
      INPUT_TOPIC: "subreddits"
      OUTPUT_TOPIC: "metric"
      TEST_NAME: "test5"

  report-reddits:
    container_name: report-reddits
    image: report-reddits
    build:
      context: .
      dockerfile: Dockerfile-report
    networks:
      - kafka-net
    environment:
      INPUT_TOPIC: "metric"

networks:
  kafka-net:
    name: kafka-net
    driver: bridge