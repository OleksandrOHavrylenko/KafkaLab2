services:
  producer-reddits:
    container_name: producer-reddits
    image: producer-reddits
    build:
      context: .
      dockerfile: Dockerfile-producer
    networks:
      - kafka-net
    environment:
      OUTPUT_TOPIC: "subreddits"
      INPUT_FILE: "full"
    depends_on:
      - report-reddits
      - consumer-reddits-1
      - consumer-reddits-2
      - consumer-reddits-3
      - consumer-reddits-4
      - consumer-reddits-5
      - consumer-reddits-6
      - consumer-reddits-7
      - consumer-reddits-8
      - consumer-reddits-9
      - consumer-reddits-10

  consumer-reddits-1:
    container_name: consumer-reddits-1
    image: consumer-reddits
    build:
      context: .
      dockerfile: Dockerfile-consumer
    networks:
      - kafka-net
    environment:
      GROUP_ID: "subreddits-group-1"
      INPUT_TOPIC: "subreddits"
      OUTPUT_TOPIC: "metric"
      TEST_NAME: "test7"

  consumer-reddits-2:
